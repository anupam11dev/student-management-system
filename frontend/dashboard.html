<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Student Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-wrapper">
    <!-- Dynamic Sidebar -->
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <!-- Main View -->
    <div class="app-main">
      <header class="app-header">
        <div class="header-left">
          <button class="menu-toggle" id="menu-toggle">☰</button>
          <div>
            <h1 class="page-title" id="welcome-heading">Academic Dashboard</h1>
          </div>
        </div>
        <div class="header-right">
          <div class="header-date" id="header-live-date"></div>
        </div>
      </header>

      <main class="page-content" id="dashboard-content">
        <!-- Dynamic role content loaded via js/dashboard.js -->
      </main>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
